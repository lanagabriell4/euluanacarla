<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ainda Bem! Luana canta Marisa - Gestão Financeira</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Google Fonts: Great Vibes (Cursiva) & Montserrat (Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        peach: '#FDF3EC',
                        cardBg: '#FFFFFF',
                        brandPink: '#E03176',
                        brandGreen: '#5B8C5A',
                        textDark: '#2D2424',
                        borderPeach: '#F5DFD0',
                        quotaGold: '#D4AF37',
                        quotaSilver: '#A8A9AD'
                    },
                    fontFamily: {
                        cursive: ['"Great Vibes"', 'cursive'],
                        sans: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FDF3EC;
            font-family: 'Montserrat', sans-serif;
            color: #2D2424;
        }
        .art-title {
            font-family: 'Great Vibes', cursive;
        }
        /* Esconder abas inativas */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* Formato orgânico fluído estilo mancha */
        .organic-shape-1 {
            border-radius: 2.5rem 1.8rem 3rem 1.5rem / 2rem 2.8rem 1.6rem 3rem;
        }
        .organic-shape-2 {
            border-radius: 1.8rem 3rem 2.2rem 2.5rem / 2.5rem 1.8rem 3rem 2.2rem;
        }
        .organic-shape-3 {
            border-radius: 3rem 2rem 1.5rem 2.8rem / 1.8rem 2.5rem 2.8rem 1.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20 md:pb-6 pt-6">

    <!-- CONTEÚDO PRINCIPAL (SPA) -->
    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-grow">

        <!-- TELA 1: HOME / MENU PRINCIPAL -->
        <section id="view-home" class="tab-content active space-y-6">
            <!-- Cabeçalho e Descrição -->
            <div class="space-y-2">
                <h1 class="text-3xl sm:text-4xl font-bold text-textDark tracking-wide">
                    Controle total do seu <span class="art-title text-brandPink text-4xl sm:text-5xl font-normal ml-1">espetáculo</span>
                </h1>
                <p class="text-sm text-gray-600">
                    Acompanhe despesas, gerencie as cotas de patrocínio e monitore a venda dos 100 ingressos em tempo real.
                </p>
            </div>

            <!-- Cards de Resumo Rápido (Total Arrecadado e Total Custos) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl p-6 border border-borderPeach shadow-sm flex flex-col justify-between">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Arrecadado</span>
                    <span id="home-total-arrecadado" class="text-3xl font-bold text-brandGreen mt-2">R$ 0,00</span>
                </div>
                <div class="bg-white rounded-2xl p-6 border border-borderPeach shadow-sm flex flex-col justify-between">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Custos</span>
                    <span id="home-total-custos" class="text-3xl font-bold text-brandPink mt-2">R$ 0,00</span>
                </div>
            </div>

            <!-- Termômetro Rápido / Saldo -->
            <div class="bg-white rounded-2xl p-6 border border-borderPeach shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Balanço Atual da Produção</h2>
                    <div id="home-saldo-container" class="flex items-baseline gap-2 mt-1">
                        <span id="home-saldo-valor" class="text-2xl sm:text-3xl font-bold">R$ 0,00</span>
                        <span id="home-saldo-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-100 text-gray-600">Calculando...</span>
                    </div>
                </div>
                <button onclick="resetarDados()" class="text-xs text-gray-400 hover:text-brandPink underline transition">
                    Restaurar Padrão / Limpar Dados
                </button>
            </div>

            <!-- Cards de Navegação Rápida (Com bordas orgânicas e ícone ao lado do título) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Card Custos -->
                <div onclick="switchTab('custos')" class="bg-white p-6 organic-shape-1 border border-borderPeach shadow-sm hover:border-brandPink transition cursor-pointer group flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-3.5 mb-3">
                            <div class="w-12 h-12 rounded-2xl bg-peach flex items-center justify-center text-brandPink group-hover:scale-110 transition shrink-0 shadow-sm">
                                <i data-lucide="wallet" class="w-6 h-6"></i>
                            </div>
                            <h3 class="text-lg font-bold text-textDark tracking-wide">CUSTOS</h3>
                        </div>
                        <p class="text-xs text-gray-500 pl-1">Lançar despesas e comparar lucros vs. gastos</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-gray-100 flex justify-between items-center text-xs font-semibold text-brandPink pl-1">
                        <span id="home-resumo
